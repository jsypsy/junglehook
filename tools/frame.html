<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>실측 뷰포트 검수 (393×749)</title>
    <!--
      화면 검수용 하네스. `npm run dev` 뒤 http://localhost:5173/tools/frame.html

      **393×749가 앱인토스 실측 뷰포트다** — iPhone 16 전체 852pt 중 토스 헤더가
      103pt를 가져간 나머지다 (한줄팡, 2026-08-16 실기기 계측).
      OS 창을 리사이즈하지 않고도 실제 폰에서의 레이아웃을 그대로 볼 수 있다.

      주의: 여기서는 DPR이 맥 화면 기준(보통 2)이라 **정수 배율은 실기기와 다를 수
      있다.** 레이아웃 검수용이지 도트 선명도 검수용이 아니다 — 배율 판단은
      실기기 배포로 확인한다
    -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #14161c;
        color: #99a0b5;
        font: 12px/1.5 ui-monospace, monospace;
      }
      iframe {
        width: 393px;
        height: 749px;
        border: 0;
        background: #000;
        box-shadow: 0 0 0 1px #333;
      }
    </style>
  </head>
  <body>
    <iframe src="/" title="게임"></iframe>
    <div>393 × 749 — 앱인토스 실측 뷰포트 (토스 헤더 103pt 제외)</div>
    <script>
      // 창이 749보다 낮으면 iframe을 시각적으로만 축소 — 내부 뷰포트는 393×749 유지.
      // 스크린샷 캡처 시 하단(깃발·소리 버튼)이 잘리지 않게 한다
      const f = document.querySelector('iframe')
      const fit = () => {
        const s = Math.min(1, (innerHeight - 34) / 749)
        f.style.transform = `scale(${s})`
        f.style.transformOrigin = 'top center'
        f.style.marginBottom = `${-749 * (1 - s)}px`
      }
      fit()
      addEventListener('resize', fit)
    </script>
  </body>
</html>
