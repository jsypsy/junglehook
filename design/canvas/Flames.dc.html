<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
    a { color: #b45309; } a:hover { color: #92400e; }
    .sheet { width: 760px; box-sizing: border-box; padding: 24px 26px 30px; background: #a9e2ff; color: #1f3a2a; }
    h2 { margin: 0 0 4px; font-size: 19px; font-weight: 900; letter-spacing: -0.3px; }
    .sub { margin: 0 0 20px; font-size: 13px; font-weight: 600; opacity: 0.72; }
    .row { display: flex; align-items: center; gap: 20px; padding: 12px 0; border-top: 2px solid rgba(31,58,42,0.18); }
    .meta { width: 176px; flex-shrink: 0; }
    .name { font-size: 14px; font-weight: 900; margin-bottom: 3px; }
    .why { font-size: 12px; font-weight: 600; line-height: 1.45; opacity: 0.75; }
    .real { width: 150px; flex-shrink: 0; display: flex; justify-content: center; }
    .zoom { flex-grow: 1; display: flex; justify-content: flex-start; }
  </style>
</helmet>
<div class="sheet">
  <h2>대시 화염 후보</h2>
  <p class="sub">왼쪽이 게임 실제 크기(캐릭터 지름 44px), 오른쪽은 2.4배 확대. 로켓 그림처럼 <b>뿌리에서 넓어지다 둥근 혹으로 뭉뚝하게</b> 끝나고, 혹 크기는 위아래가 제각각입니다.</p>

  <sc-for list="{{flames}}" as="f" hint-placeholder-count="5">
    <div class="row">
      <div class="meta">
        <div class="name">{{f.name}}</div>
        <div class="why">{{f.why}}</div>
      </div>
      <div class="real">
        <svg width="130" height="96" viewBox="0 0 130 96">
          <g transform="translate(1,-12)">
            <path d="{{f.outer}}" fill="#e6392b" stroke="#1f3a2a" stroke-width="3" stroke-linejoin="round" />
            <path d="{{f.mid}}" fill="#ff7f3f" />
            <path d="{{f.core}}" fill="#ffcc33" />
            <circle cx="100" cy="60" r="22" fill="#fff1b0" stroke="#1f3a2a" stroke-width="3" />
            <g fill="#1f3a2a">
              <rect x="89" y="55" width="9" height="5" rx="1.5" />
              <rect x="101" y="55" width="9" height="5" rx="1.5" />
              <rect x="98" y="56" width="3" height="2" />
            </g>
          </g>
        </svg>
      </div>
      <div class="zoom">
        <svg width="312" height="230" viewBox="0 0 130 96">
          <g transform="translate(1,-12)">
            <path d="{{f.outer}}" fill="#e6392b" stroke="#1f3a2a" stroke-width="3" stroke-linejoin="round" />
            <path d="{{f.mid}}" fill="#ff7f3f" />
            <path d="{{f.core}}" fill="#ffcc33" />
            <circle cx="100" cy="60" r="22" fill="#fff1b0" stroke="#1f3a2a" stroke-width="3" />
            <g fill="#1f3a2a">
              <rect x="89" y="55" width="9" height="5" rx="1.5" />
              <rect x="101" y="55" width="9" height="5" rx="1.5" />
              <rect x="98" y="56" width="3" height="2" />
            </g>
          </g>
        </svg>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
